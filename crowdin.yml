"project_id_env": "CROWDIN_PROJECT_ID"
"api_token_env": "CROWDIN_PERSONAL_TOKEN"
"base_path": "./translations/"
"base_url": "https://api.crowdin.com"

files: [{
    "source": "/en-GB/**/*.json",
    "translation": "/%locale%/**/%original_file_name%",
    "type": "json",
    "update_option": "update_as_unapproved",
    "translation_replace": {
        "no-NO": "nn-NO"
    },
    "languages_mapping": {
        "locale": {
            "sr-CS": "sr-RS"
        }
    }
}]
