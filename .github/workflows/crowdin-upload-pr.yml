name: "Crowdin Upload PR Translations"

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch whose translations will be uploaded"
        required: false
        type: string
      pull_request:
        description: "Pull request number (only for merged pull requests). Leave empty when using a branch."
        required: false
        type: string
      dry_run:
        description: "Only list the files Crowdin would upload"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

jobs:
  crowdin-upload-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout translations
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Collect translation changes
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ inputs.branch }}
          PR_NUMBER: ${{ inputs.pull_request }}
        run: |
          set -euo pipefail

          if [[ -n "${BRANCH}" && -n "${PR_NUMBER}" ]] || [[ -z "${BRANCH}" && -z "${PR_NUMBER}" ]]; then
            echo "::error::Fill in either a branch or a pull request number, not both."
            exit 1
          fi

          if [[ -n "${PR_NUMBER}" ]]; then
            if [[ ! "${PR_NUMBER}" =~ ^[0-9]+$ ]]; then
              echo "::error::'${PR_NUMBER}' is not a pull request number."
              exit 1
            fi
            SOURCE="PR #${PR_NUMBER}"

            # The API keeps the file list of a PR even after it was merged, when git can no longer tell its changes apart.
            mapfile -t FILES < <(
              gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
                --jq '.[] | select(.status != "removed") | .filename'
            )

            git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head"
            head_sha=$(git rev-parse FETCH_HEAD)
            base_sha=$(gh pr view "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --json baseRefOid --jq '.baseRefOid')
            git fetch --no-tags origin "${base_sha}"
          else
            SOURCE="branch ${BRANCH}"

            git fetch --no-tags origin "${BRANCH}"
            head_sha=$(git rev-parse FETCH_HEAD)
            base_sha=$(git merge-base origin/main "${head_sha}")

            if [[ "${base_sha}" == "${head_sha}" ]]; then
              echo "::error::${BRANCH} is already merged into main; upload it via its pull request number instead."
              exit 1
            fi

            mapfile -t FILES < <(git diff --name-only --diff-filter=ACMRT "${base_sha}" "${head_sha}")
          fi
          echo "${SOURCE}: head ${head_sha}, base ${base_sha}"

          mapfile -t FILES < <(
            printf '%s\n' "${FILES[@]}" | grep -E '^translations/[^/]+/.+\.json$' | grep -v '^translations/en-GB/' || true
          )
          if (( ${#FILES[@]} == 0 )); then
            echo "::error::${SOURCE} does not change any translation files (en-GB sources are ignored)."
            exit 1
          fi

          # Remove every other translation file so the Crowdin CLI uploads nothing but these changes;
          # the en-GB sources stay as they are on main.
          declare -A keep
          for file in "${FILES[@]}"; do
            keep["${file}"]=1
          done
          while IFS= read -r file; do
            [[ "${file}" == translations/en-GB/* ]] && continue
            [[ -n "${keep[${file}]:-}" ]] && continue
            rm -f "${file}"
          done < <(git ls-files translations)

          # Auto-approving a whole file would also approve strings translators changed in Crowdin after the branch
          # was created. Reduce every file to the keys that were actually added or changed.
          UPLOAD=()
          for file in "${FILES[@]}"; do
            git show "${base_sha}:${file}" > base.json 2>/dev/null || echo '{}' > base.json
            git show "${head_sha}:${file}" > head.json
            jq --indent 4 --slurpfile base base.json '
              def changed($base):
                if type == "object" then
                  to_entries
                  | map(. as $entry | .value = ($entry.value | changed(if ($base | type) == "object" then $base[$entry.key] else null end)))
                  | map(select(.value != null and .value != {}))
                  | from_entries
                else
                  if . == $base then null else . end
                end;
              changed($base[0])
            ' head.json > "${file}"

            if [[ "$(jq 'length' "${file}")" == "0" ]]; then
              echo "Skipping ${file}: no changed strings"
              rm -f "${file}"
              continue
            fi
            UPLOAD+=("${file} ($(jq '[.. | strings] | length' "${file}") strings)")
          done
          rm -f base.json head.json

          if (( ${#UPLOAD[@]} == 0 )); then
            echo "::error::${SOURCE} changes no translated strings."
            exit 1
          fi

          {
            echo "### Uploading ${#UPLOAD[@]} translation file(s) from ${SOURCE}"
            echo
            printf -- '- `%s`\n' "${UPLOAD[@]}"
          } | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Exclude en-GB from the upload
        run: |
          # en-GB is also a target language in Crowdin, so the CLI would upload the source files as its translations.
          # Point its translation folder somewhere that does not exist; the CLI then skips the language.
          yq '(.files[] | select(.translation | contains("%locale%")) | .languages_mapping.locale."en-GB") = "en-GB-is-source"' crowdin.yml > crowdin-upload-pr.yml

      - name: Upload translations to Crowdin
        uses: crowdin/github-action@v1
        with:
          config: crowdin-upload-pr.yml
          upload_sources: false
          upload_translations: true
          import_eq_suggestions: true
          auto_approve_imported: true
          download_translations: false
          preserve_hierarchy: false
          dryrun_action: ${{ inputs.dry_run }}
        env:
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
