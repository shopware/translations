name: "Crowdin Download Action"

on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *' # Every day at 22:00 UTC

permissions:
  contents: write
  pull-requests: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
  CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
  LOCALIZATION_BRANCH: i18n_crowdin_translations

jobs:
  crowdin-download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      # Only download into the workspace. Crowdin re-exports every file on each run, so the
      # branch and pull request are created below, after the export has been cleaned up and
      # compared against main.
      - name: Download translations from Crowdin
        uses: crowdin/github-action@v1
        with:
          upload_sources: false
          upload_translations: false
          download_translations: true
          push_translations: false
          create_pull_request: false

      - name: Clean up export, update metadata and open pull request
        run: |
          # Exit immediately on error (-e), treat unset variables as an error (-u),
          # and ensure pipeline errors are not masked (-o pipefail)
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Crowdin exports untranslated strings as "", which Shopware would render literally
          # instead of falling back to en-GB. Drop them (and objects left empty by that) so only
          # real translations reach the language files; a file without any translation is removed.
          # git diff ignores untracked paths, so files new to the repo must be registered first or
          # they would skip the cleanup and still be swept up by the git add below.
          git add --intent-to-add translations
          mapfile -t EXPORTED < <(git diff --name-only --diff-filter=ACMRT origin/main -- translations)
          echo "Exported files: ${#EXPORTED[@]}"

          for file in "${EXPORTED[@]}"; do
            [[ "${file}" == translations/*.json && -f "${file}" ]] || continue
            # de-DE and en-GB are maintained in the shopware repo; empty strings there are intentional
            [[ "${file}" == translations/de-DE/* || "${file}" == translations/en-GB/* ]] && continue
            jq --indent 4 '
              def prune:
                if type == "object" then with_entries(.value |= prune) | with_entries(select(.value != "" and .value != {}))
                elif type == "array" then map(prune) | map(select(. != "" and . != {}))
                else . end;
              prune
            ' "${file}" > "${file}.tmp" && mv "${file}.tmp" "${file}"

            if [[ "$(jq 'length' "${file}")" == "0" ]]; then
              echo "Removing ${file}: no translations left"
              rm "${file}"
            fi
          done

          # Only files that still differ from main after the cleanup count as changed
          mapfile -t CHANGED < <(git diff --name-only origin/main -- translations)
          echo "Changed files after cleanup: ${#CHANGED[@]}"

          if (( ${#CHANGED[@]} == 0 )); then
            echo "Crowdin export contains no translation changes, nothing to do."
            exit 0
          fi

          # Run the metadata update script, passing the changed files as arguments
          node scripts/update-metadata.mjs "${CHANGED[@]}"

          # Rebuild the localization branch from main so it only ever carries the current export
          git checkout -B "${LOCALIZATION_BRANCH}"
          git add translations crowdin-metadata.json
          git commit -m "New Crowdin translations by GitHub Action"
          git push --force origin "${LOCALIZATION_BRANCH}"

          if [[ -z "$(gh pr list --head "${LOCALIZATION_BRANCH}" --base main --state open --json number --jq '.[0].number')" ]]; then
            gh pr create \
              --head "${LOCALIZATION_BRANCH}" \
              --base main \
              --title 'Crowdin translations' \
              --body 'Crowdin translations update'
          else
            echo "Pull request for ${LOCALIZATION_BRANCH} already open, updated via push."
          fi
